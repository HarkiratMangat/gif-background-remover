[pytest]
# -n 6 matches machine.default_jobs() on this hardware: 6 performance cores, and the tests are
# subprocess-bound (they shell out to the real CLI), so they parallelise the same way the rest
# of the harness does.
#
# ⚠️ This was NOT safe until 2026-08-20. Six tests read fixed /tmp/*.webp paths, so parallel
# workers would have raced on the same filenames and produced flaky failures that look exactly
# like real regressions -- strictly worse than a slow suite. They now render through
# `rendered()`, which caches per script-SHA under local/.test-renders/ and is read-only once
# warm, so workers share it without contending.
addopts = -n 6 -q
